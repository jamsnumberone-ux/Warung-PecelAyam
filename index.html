<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan Pecel Ayam</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Pecel Ayam Mantap</h1>
            <h3 id="info-meja">Meja: -</h3>
        </header>

        <main id="main-content">
            <section id="menu-list" class="grid-container">
                <!-- Menu render dari Firebase -->
            </section>

            <section id="cart-section">
                <h2>Keranjang Pesanan</h2>
                <ul id="cart-list"></ul>
                <p class="total">Total: Rp <span id="total-price">0</span></p>
                
                <textarea id="order-notes" placeholder="Catatan (misal: paha, sambel pisah)"></textarea>
                
                <select id="payment-method">
                    <option value="Tunai">Bayar Tunai di Kasir</option>
                    <option value="QRIS">Bayar via QRIS / E-Wallet</option>
                </select>
                
                <button id="btn-checkout" onclick="checkout()">Kirim ke Dapur</button>
            </section>
        </main>

        <!-- Layar Tracking Pesanan (Disembunyikan di awal) -->
        <section id="order-tracking" style="display: none; text-align: center;">
            <h2>Status Pesanan Anda</h2>
            <div id="status-badge" class="badge badge-pending">Menunggu Konfirmasi</div>
            <p>Rincian: <span id="track-items"></span></p>
            <p>Total: Rp <span id="track-total"></span> (<span id="track-payment"></span>)</p>
            <div id="qris-info" style="display: none;">
                <p>Silakan scan QRIS di meja atau kasir untuk pembayaran.</p>
            </div>
        </section>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
